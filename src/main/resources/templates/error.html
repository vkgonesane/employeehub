<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="main-content">
  <div class="container">
    <div class="error-page">
      <div class="error-code" th:text="${errorCode ?: '500'}">500</div>
      <h2>Something went wrong</h2>
      <p th:text="${errorMessage ?: 'An unexpected error occurred.'}"></p>
      <a th:href="@{/employees}" class="btn btn-primary">
        <i data-feather="home"></i> Go Home
      </a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>feather.replace();</script>
</body>
</html>
