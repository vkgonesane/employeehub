<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employee Details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="main-content">
  <div class="container container-narrow">

    <nav class="breadcrumb">
      <a th:href="@{/employees}"><i data-feather="home"></i> Employees</a>
      <span class="breadcrumb-sep">/</span>
      <span th:text="${employee.fullName}"></span>
    </nav>

    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar" th:text="${employee.firstName.charAt(0)} + '' + ${employee.lastName.charAt(0)}"></div>
        <div class="detail-title">
          <h1 th:text="${employee.fullName}"></h1>
          <p th:text="${employee.position} + ' · ' + ${employee.department}" class="detail-subtitle"></p>
          <span class="badge"
                th:classappend="${employee.status.name() == 'ACTIVE' ? 'badge-active' :
                                  employee.status.name() == 'INACTIVE' ? 'badge-inactive' : 'badge-leave'}"
                th:text="${employee.status}"></span>
        </div>
        <div class="detail-actions">
          <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-primary">
            <i data-feather="edit-2"></i> Edit
          </a>
          <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post"
                onsubmit="return confirm('Are you sure you want to delete this employee?')">
            <button type="submit" class="btn btn-danger">
              <i data-feather="trash-2"></i> Delete
            </button>
          </form>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-section">
          <h3>Contact Information</h3>
          <div class="detail-grid">
            <div class="detail-item">
              <label>Email</label>
              <span th:text="${employee.email}"></span>
            </div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Employment Details</h3>
          <div class="detail-grid">
            <div class="detail-item">
              <label>Department</label>
              <span th:text="${employee.department}"></span>
            </div>
            <div class="detail-item">
              <label>Position</label>
              <span th:text="${employee.position}"></span>
            </div>
            <div class="detail-item">
              <label>Salary</label>
              <span th:text="${'$' + #numbers.formatDecimal(employee.salary, 1, 'COMMA', 2, 'POINT')}"></span>
            </div>
            <div class="detail-item">
              <label>Hire Date</label>
              <span th:text="${#temporals.format(employee.hireDate, 'MMMM d, yyyy')}"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="back-link">
      <a th:href="@{/employees}" class="btn btn-ghost">
        <i data-feather="arrow-left"></i> Back to List
      </a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script>feather.replace();</script>
</body>
</html>
