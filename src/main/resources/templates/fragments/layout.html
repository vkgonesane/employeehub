<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ── head fragment ──────────────────────────────────────────── -->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' | EmployeeHub'">EmployeeHub</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <!-- Feather icons via CDN -->
  <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>
</head>

<!-- ── navbar fragment ──────────────────────────────────────────── -->
<nav th:fragment="navbar" class="navbar">
  <div class="navbar-brand">
    <i data-feather="users" class="brand-icon"></i>
    <span>EmployeeHub</span>
  </div>
  <div class="navbar-links">
    <a th:href="@{/employees}" class="nav-link">
      <i data-feather="grid"></i> Employees
    </a>
    <a th:href="@{/employees/new}" class="nav-link btn-primary-nav">
      <i data-feather="user-plus"></i> Add Employee
    </a>
  </div>
</nav>

<!-- ── footer fragment ──────────────────────────────────────────── -->
<footer th:fragment="footer">
  <div class="footer-inner">
    <span>© 2024 EmployeeHub · Built with Spring Boot + Thymeleaf + PostgreSQL</span>
  </div>
</footer>

</html>
